name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"  # Minimum supported Python version
          - "3.14"  # Home Assistant
          - "3.15"  # Latest Python version
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Install package and dev dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run --no-sync pytest